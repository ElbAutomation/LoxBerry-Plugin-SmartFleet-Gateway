; --- Wiederherstellung ----------------------------------------------------
WIEDERHERSTELLUNG_TITEL="Wiederherstellung"
WIEDERHERSTELLUNG_WARNUNG="Das Einspielen ersetzt die gesamte Konfiguration dieses Plugins unwiderruflich - Standort, Zertifikat, Einstellungen und das Fernwartungs-Passwort. Es gibt keine automatische Sicherheitskopie des aktuellen Standes."
LABEL_WIEDERHERSTELLUNG_DATEI="Backup-Datei (.7z)"
LABEL_WIEDERHERSTELLUNG_PASSWORT="Passwort des Backups"
HINWEIS_WIEDERHERSTELLUNG_PASSWORT="Das Backup ist verschlüsselt. Es gilt das Passwort, das im LoxBerry zum Zeitpunkt der Sicherung für den Miniserver mit der niedrigsten Nummer unter den übertragenen hinterlegt war (dasselbe, mit dem der LoxBerry auf ihn zugreift). Bei einem älteren, noch unverschlüsselten Backup bleibt das Feld leer."
HINWEIS_WIEDERHERSTELLUNG="Ein zuvor über diese Seite erzeugtes Eigenbackup dieses Plugins - zu finden beim Partner unter dem Standort, Gerät „LoxBerry“, Reiter Backups."
BTN_WIEDERHERSTELLEN="Einspielen"
MELDUNG_WIEDERHERSTELLUNG_OK="Die Konfiguration wurde eingespielt. Bitte die Seite neu laden."
MELDUNG_WIEDERHERSTELLUNG_KEINE_DATEI="Bitte eine Datei auswählen."
MELDUNG_WIEDERHERSTELLUNG_UPLOAD_FEHLER="Die Datei ließ sich nicht entgegennehmen."
MELDUNG_WIEDERHERSTELLUNG_KEIN_7Z="7-Zip ist auf diesem LoxBerry nicht installiert - ohne dieses Werkzeug lässt sich das Archiv nicht öffnen."
MELDUNG_WIEDERHERSTELLUNG_KAPUTT="Die Datei ließ sich nicht entpacken - ist es wirklich ein gültiges 7z-Archiv?"
MELDUNG_WIEDERHERSTELLUNG_KEIN_MANIFEST="Das ist kein Eigenbackup dieses Plugins. Die Konfiguration wurde NICHT verändert."
MELDUNG_WIEDERHERSTELLUNG_KOPIEREN_FEHLGESCHLAGEN="Das Einspielen wurde begonnen, ließ sich aber nicht abschließen - mindestens eine Datei konnte nicht geschrieben werden. Die Konfiguration dieses Plugins ist jetzt UNVOLLSTÄNDIG: Der alte Stand wurde entfernt, der neue nur teilweise angelegt. Bitte den freien Platz und die Schreibrechte des Konfigurationsverzeichnisses prüfen und danach dasselbe Backup erneut einspielen."
MELDUNG_WIEDERHERSTELLUNG_ZU_GROSS="Die Datei ist zu groß (mehr als 20 MB). Ein Eigenbackup dieses Plugins ist nur wenige Kilobyte groß - bitte prüfen, ob die richtige Datei ausgewählt wurde."
MELDUNG_WIEDERHERSTELLUNG_FEHLER="Die Wiederherstellung ist fehlgeschlagen."

