VAULT_PIN_RESET_TEXT="Der LoxBerry vergisst den bisher gemerkten Tresorschlüssel des Servers und übernimmt beim nächsten Kontakt den aktuellen. Das ist nur nötig, wenn der Tresor auf dem Server neu angelegt wurde."
