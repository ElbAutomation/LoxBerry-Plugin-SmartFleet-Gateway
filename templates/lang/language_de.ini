MELDUNG_VORSCHLAG_FEHLER="Es ließ sich kein Passwort erzeugen. Bitte melden Sie das Ihrem Partner."
MELDUNG_PRUEFUNG_FEHLER="Das Passwort ließ sich nicht prüfen. Bitte melden Sie das Ihrem Partner."
MELDUNG_ZU_SCHWACH="Dieses Passwort ist zu leicht zu erraten - z.B. weil es ein Wörterbuchwort, einen Namen, ein Datum oder ein wiederkehrendes Muster enthält. Nehmen Sie mehrere zufällige, unzusammenhängende Wörter oder mindestens 20 zufällige Zeichen - oder lassen Sie eines erzeugen."
MELDUNG_ABLEGEN_FEHLER="Das Passwort ließ sich nicht speichern."

