VAULT_WIDERRUF_TITEL="Übertragung wirklich widerrufen?"
VAULT_WIDERRUF_TEXT="Die Übertragung endet, und alle für diesen Standort gespeicherten Einträge (Miniserver- und Fernwartungs-Passwörter) werden auf dem Server gelöscht. Passwörter, die bereits abgerufen wurden, sind damit nicht ungesehen. Zum erneuten Aktivieren ist eine neue Zustimmung nötig."
