VAULT_MELDUNG_WIDERRUF="Die Übertragung wurde widerrufen. Die für diesen Standort gespeicherten Einträge werden auf dem Server gelöscht."
VAULT_MELDUNG_PIN="Der Tresorschlüssel wurde zurückgesetzt. Beim nächsten Kontakt übernimmt der LoxBerry den aktuellen Schlüssel des Servers."
