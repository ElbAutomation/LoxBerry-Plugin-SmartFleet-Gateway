TRESOR_WARTET="Es liegt auf diesem LoxBerry und wird an den Passwort Tresor übertragen, sobald dieser eingerichtet ist."

VAULT_POPUP_TITEL="Passwörter verschlüsselt an den Server übertragen?"
VAULT_POPUP_INTRO="Bei Zustimmung sendet dieses Plugin folgende Passwörter dieses Standorts an den SmartFleet-Server, mit dem es verbunden ist:"
VAULT_POPUP_PUNKT_1="die Passwörter der Miniserver – bei jeder Änderung automatisch neu"
VAULT_POPUP_PUNKT_2="das Fernwartungs-Passwort dieses LoxBerry, sobald es gesetzt wird"
VAULT_POPUP_WIE_TITEL="So funktioniert es:"
VAULT_POPUP_WIE="Die Passwörter werden hier auf dem LoxBerry mit dem öffentlichen Schlüssel des Tresors dieses Standorts verschlüsselt, bevor sie den LoxBerry verlassen. Auf dem Server liegen ausschließlich verschlüsselte Daten; auch der Server kann sie nicht lesen. Entschlüsseln kann sie nur, wer das Masterpasswort dieses Tresors kennt und für diesen Standort berechtigt ist."
VAULT_POPUP_BEACHTEN_TITEL="Bitte beachten:"
VAULT_POPUP_RISIKO_1="Wer eines dieser Passwörter erlangt, erhält Zugriff auf den jeweiligen Miniserver bzw. diesen LoxBerry: Einstellungen ändern, Ausgänge schalten, Daten einsehen."
VAULT_POPUP_RISIKO_2="Das Verfahren ist nach heutigem Stand der Technik so aufgebaut, dass es sicher ist. Vollständige Sicherheit gibt es nicht; sie hängt auch am Masterpasswort und an den Geräten derer, die es kennen."
VAULT_POPUP_RISIKO_3_A="Die Übertragung erfolgt"
VAULT_POPUP_RISIKO_3_B="auf eigenes Risiko"
VAULT_POPUP_RISIKO_3_C=". Für diese Funktion wird – soweit gesetzlich zulässig – keine Gewährleistung und keine Haftung übernommen. Zwingende gesetzliche Haftung, etwa bei Vorsatz, bleibt unberührt."
VAULT_POPUP_RISIKO_4="Widerruf ist jederzeit möglich: Die Übertragung endet, und die für diesen Standort gespeicherten Einträge werden auf dem Server gelöscht. Passwörter, die bereits abgerufen wurden, sind damit nicht ungesehen; im Zweifel müssen sie am Miniserver geändert werden."
VAULT_POPUP_HAKEN="Ich habe den Hinweis gelesen und übernehme das Risiko. Ich stimme der Übertragung zu."
VAULT_POPUP_ABBRECHEN="Abbrechen"
VAULT_POPUP_ZUSTIMMEN="Zustimmen"
