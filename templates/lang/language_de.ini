LABEL_PASSWORT="Passwort"
PASSWORT_HINWEIS="Dieses Passwort wird für die Fernwartung gebraucht. Geprüft wird die Erratbarkeit, nicht nur die Länge: Wörterbuchwörter, Namen, Daten und wiederkehrende Muster fallen auch bei vielen Zeichen durch. Am einfachsten ist ein erzeugtes Passwort; bei eigener Wahl mehrere zufällige, unzusammenhängende Wörter oder mindestens 20 zufällige Zeichen verwenden."
BTN_VORSCHLAG="Zufallspasswort erzeugen"
BTN_SETZEN="Passwort speichern"
